<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>National Parks Matching Game</title>

<style>
body {
  margin: 0;
  font-family: Georgia, 'Times New Roman', Times, serif;
  background: #0f2f2f;
  color: #fff;
  display: flex;
}

.sidebar {
  width: 260px;
  padding: 16px;
  background: #133;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

h1 {
  margin: 0;
  font-size: 22px;
}

label {
  font-size: 14px;
}

select, button {
  padding: 8px;
  border-radius: 6px;
  border: none;
  font-family: inherit;
  font-size: 14px;
}

button {
  background: #2ecc71;
  cursor: pointer;
}

button:hover {
  background: #27ae60;
}

.scoreboard {
  background: #0b2222;
  padding: 10px;
  border-radius: 6px;
  font-size: 14px;
  line-height: 1.4;
}

.main {
  flex: 1;
  padding: 20px;
}

.game-board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 16px;
  max-width: 900px;
  margin: auto;
}

.card {
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  padding-top: 140%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.4s;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px;
}

.back {
  background: linear-gradient(135deg, #1abc9c, #16a085);
  font-size: 26px;
}

.front {
  transform: rotateY(180deg);
  background: #f5f5f5;
  color: #1f2f2f;
  font-size: 14px;
  font-weight: bold;
}

.matched {
  visibility: hidden;
}
</style>
</head>

<body>

<div class="sidebar">
  <h1>🏞 Match the Parks</h1>

  <label>Difficulty</label>
  <select id="difficulty">
    <option value="6">Easy (6 pairs)</option>
    <option value="8" selected>Medium (8 pairs)</option>
    <option value="12">Hard (12 pairs)</option>
  </select>

  <label>Game Mode</label>
  <select id="mode">
    <option value="solo">Solo</option>
    <option value="friend">2 Players</option>
    <option value="computer">Vs Computer</option>
  </select>

  <button onclick="newGame()">New Game</button>
  <button onclick="copyLink()">Copy Share Link</button>

  <div class="scoreboard">
    ⏱ Time: <span id="time">0</span>s<br>
    🧍 Player 1: <span id="p1">0</span><br>
    🤖 Player 2: <span id="p2">0</span><br>
    ▶ Turn: <span id="turn">1</span>
  </div>
</div>

<div class="main">
  <div class="game-board" id="board"></div>
</div>

<script>
const PARKS = [
  "Yosemite National Park",
  "Yellowstone National Park",
  "Grand Canyon National Park",
  "Zion National Park",
  "Rocky Mountain National Park",
  "Acadia National Park",
  "Olympic National Park",
  "Glacier National Park",
  "Sequoia National Park",
  "Arches National Park",
  "Bryce Canyon National Park",
  "Joshua Tree National Park",
  "Everglades National Park",
  "Denali National Park",
  "Mount Rainier National Park",
  "Badlands National Park",
  "Big Bend National Park",
  "Shenandoah National Park"
];

let flippedCards = [];
let lockBoard = false;
let currentPlayer = 0;
let scores = [0, 0];
let seconds = 0;
let timer;

function newGame() {
  clearInterval(timer);
  seconds = 0;
  document.getElementById("time").textContent = 0;

  scores = [0, 0];
  updateScores();

  currentPlayer = 0;
  document.getElementById("turn").textContent = "1";

  flippedCards = [];
  lockBoard = false;

  const pairs = +document.getElementById("difficulty").value;
  const board = document.getElementById("board");
  board.innerHTML = "";

  const chosen = [...PARKS].sort(() => Math.random() - 0.5).slice(0, pairs);
  const cards = [...chosen, ...chosen].sort(() => Math.random() - 0.5);

  cards.forEach(park => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.park = park;
    card.innerHTML = `
      <div class="card-inner">
        <div class="face back">🌲</div>
        <div class="face front">${park}</div>
      </div>
    `;
    card.onclick = () => flipCard(card);
    board.appendChild(card);
  });

  timer = setInterval(() => {
    seconds++;
    document.getElementById("time").textContent = seconds;
  }, 1000);
}

function flipCard(card) {
  if (lockBoard) return;
  if (card.classList.contains("flipped") || card.classList.contains("matched")) return;
  if (flippedCards.length === 2) return;

  card.classList.add("flipped");
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    lockBoard = true;
    setTimeout(checkMatch, 600);
  }
}

function checkMatch() {
  const [a, b] = flippedCards;
  const isMatch = a.dataset.park === b.dataset.park;

  if (isMatch) {
    scores[currentPlayer]++;
    updateScores();
    a.classList.add("matched");
    b.classList.add("matched");
    flippedCards = [];
    lockBoard = false;
    computerTurn(); // same player continues
  } else {
    setTimeout(() => {
      a.classList.remove("flipped");
      b.classList.remove("flipped");
      flippedCards = [];
      lockBoard = false;
      nextTurn();
    }, 500);
  }
}

function nextTurn() {
  if (document.getElementById("mode").value === "solo") return;
  currentPlayer = 1 - currentPlayer;
  document.getElementById("turn").textContent = currentPlayer + 1;
  computerTurn();
}

function computerTurn() {
  if (document.getElementById("mode").value !== "computer") return;
  if (currentPlayer !== 1) return;

  const available = [...document.querySelectorAll(".card:not(.flipped):not(.matched)")];
  if (available.length < 2) return;

  setTimeout(() => {
    flipCard(available[Math.floor(Math.random() * available.length)]);
    setTimeout(() => {
      const remaining = [...document.querySelectorAll(".card:not(.flipped):not(.matched)")];
      flipCard(remaining[Math.floor(Math.random() * remaining.length)]);
    }, 600);
  }, 800);
}

function updateScores() {
  document.getElementById("p1").textContent = scores[0];
  document.getElementById("p2").textContent = scores[1];
}

function copyLink() {
  navigator.clipboard.writeText(location.href);
  alert("Link copied! Share with a friend.");
}

newGame();
</script>

</body>
</html>
